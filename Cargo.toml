[workspace]
resolver = "3"
members = ["core", "sdk", "carts/hello", "carts/twirl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/raskell-io/wasm-ad"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
