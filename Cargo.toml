[workspace]
resolver = "3"
members = [
    "core",
    "sdk/rust",
    "carts/hello",
    "carts/twirl",
    "conformance/carts/tiles",
    "conformance/carts/effects",
    "conformance/carts/sprites",
    "conformance/carts/bitmap",
    "conformance/carts/affine",
    "conformance/carts/sound",
    "conformance/carts/samples",
    "conformance/carts/system",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/raskell-io/wasm-ad"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
