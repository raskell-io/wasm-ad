name: Site

# Builds the website and uploads it to the Cloudflare Pages project
# `wasmad-raskell-io`, which serves wasmad.raskell.io. Needs the repository secret
# CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bundled into the site's cart slot.
      - uses: actions/checkout@v4
        with:
          repository: raskell-io/rainbow-river
          path: rainbow-river
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: make site RAINBOW_RIVER=rainbow-river
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: cf608a0a961c5a40f720e3dec3cc7135
          # `pages` is the project's production branch.
          command: pages deploy dist --project-name=wasmad-raskell-io --branch=pages --commit-dirty=true
