name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test
      - run: make all
      # The host conformance suite, against the reference core and the web player's host.
      - run: make host-test

  # Every SDK's starter cart, checked against the spec and against each other.
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # TinyGo 0.43 needs Go 1.25 through 1.27.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: 0.43.0
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: cd sdk/zig && zig build test
      - run: make sdk-test
        env:
          REQUIRE_ALL: 1
      # The steps in sdk/tinygo/README.md, against the latest released module.
      - name: Build a cart from the released Go SDK
        run: |
          tag=$(git ls-remote --tags --refs origin 'sdk/tinygo/v*' | sed 's#.*refs/tags/sdk/tinygo/##' | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/gocart" && cp sdk/tinygo/examples/starter/main.go "$RUNNER_TEMP/gocart/"
          cd "$RUNNER_TEMP/gocart"
          go mod init example.com/cart
          go mod edit -require=github.com/raskell-io/wasm-ad/sdk/tinygo@$tag
          go mod download github.com/raskell-io/wasm-ad/sdk/tinygo
          cp "$(go list -m -f '{{.Dir}}' github.com/raskell-io/wasm-ad/sdk/tinygo)/wasm-ad.json" .
          tinygo build -target wasm-ad.json -scheduler=none -panic=trap -opt=z -no-debug -o cart.wasm .
          node "$GITHUB_WORKSPACE/tools/wasmad.mjs" meta cart.wasm title=Starter
          node "$GITHUB_WORKSPACE/tools/wasmad.mjs" check cart.wasm
