<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Specification · WASM-AD</title>
  <meta name="description" content="The WASM-AD specification: cart format, memory map, registers and rendering rules.">
  <link rel="icon" href="assets/cartridge.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,600;1,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .doc { max-width: 1240px; margin: 0 auto; padding: 104px clamp(16px, 4vw, 48px) 32px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; }
    .toc { position: sticky; top: 96px; align-self: start; max-height: calc(100vh - 120px); overflow: auto; font-size: 14px; }
    .toc p { font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
    .toc a { display: block; padding: 4px 0 4px 12px; color: var(--muted); border-left: 2px solid var(--line); }
    .toc a:hover, .toc a.on { color: var(--fg); border-color: var(--violet); }
    .prose { min-width: 0; color: #d6d1f5; }
    .prose h1 { font-size: clamp(32px, 4vw, 48px); }
    .prose h2 { font-size: 28px; margin: 56px 0 14px; padding-top: 16px; border-top: 2px solid var(--line); scroll-margin-top: 90px; }
    .prose h3 { font-size: 18px; margin: 32px 0 8px; color: var(--fg); scroll-margin-top: 90px; }
    .prose p, .prose li { font-size: 16px; }
    .prose strong { color: var(--fg); }
    .prose table { border-collapse: collapse; width: 100%; margin: 16px 0 24px; font-size: 14.5px; display: block; overflow-x: auto; }
    .prose th, .prose td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .prose th { color: var(--fg); font-weight: 600; background: var(--ink-2); }
    .prose td code { white-space: nowrap; }
    .prose pre { padding: 14px 16px; background: #0f0d22; border: 2px solid var(--line); border-radius: 8px; font: 13px/1.6 var(--mono); margin: 12px 0 20px; }
    .prose blockquote { margin: 0; padding: 4px 16px; border-left: 3px solid var(--violet); color: var(--muted); }
    .prose a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    #contents, #contents + ol, #contents + ul { display: none; } /* the in-document contents list; the sidebar replaces it */
    .loading { color: var(--muted); }
    @media (max-width: 900px) { .doc { grid-template-columns: 1fr; } .toc { display: none; } #contents, #contents + ol, #contents + ul { display: block; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="./" aria-label="WASM-AD home"><img src="assets/cartridge.png" alt="" width="30" height="30"><span class="wordmark"><b>WASM</b><i>AD</i></span></a>
    <div class="nav-links">
      <a href="./#play">Play</a>
      <a href="./#hardware">Hardware</a>
      <a href="./#start">Get started</a>
      <a href="spec.html">Spec</a>
      <a href="https://github.com/raskell-io/wasm-ad" class="gh">GitHub</a>
    </div>
  </nav>
  <div class="doc">
    <aside class="toc" id="toc"><p>Contents</p></aside>
    <article class="prose" id="spec"><p class="loading">Loading the specification…</p></article>
  </div>
  <footer class="footer">
    <span class="stripe"></span>
    <p>Source: <a href="https://github.com/raskell-io/wasm-ad/blob/main/SPEC.md">SPEC.md</a> · MIT · Not affiliated with Nintendo.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    const slug = (s) => s.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
    fetch('SPEC.md').then((r) => r.text()).then((md) => {
      const article = document.getElementById('spec');
      article.innerHTML = marked.parse(md);
      const toc = document.getElementById('toc');
      for (const h of article.querySelectorAll('h2, h3')) {
        h.id = slug(h.textContent);
        if (h.tagName === 'H2' && h.id !== 'contents') {
          const a = Object.assign(document.createElement('a'), { href: `#${h.id}`, textContent: h.textContent });
          toc.append(a);
        }
      }
      if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
      const links = [...toc.querySelectorAll('a')];
      const observer = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.hash === `#${e.target.id}`));
        }
      }, { rootMargin: '-90px 0px -70% 0px' });
      article.querySelectorAll('h2').forEach((h) => observer.observe(h));
    }).catch(() => {
      document.getElementById('spec').innerHTML = '<p>Could not load the spec. <a href="https://github.com/raskell-io/wasm-ad/blob/main/SPEC.md">Read it on GitHub</a>.</p>';
    });
  </script>
</body>
</html>
